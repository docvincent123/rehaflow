name: Build RehaFlow Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: rehaflow-android-apk
  cancel-in-progress: true

jobs:
  build-android:
    name: Build RehaFlow APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: ''

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npm run typecheck

      - name: Expo configuration validation
        env:
          CI: 1
        run: npx expo config --type public > /tmp/rehaflow-expo-config.json

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Prebuild Android
        env:
          CI: 1
        run: npx expo prebuild --platform android --clean

      - name: Verify Gradle wrapper
        working-directory: android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "Release APK was not produced"
            exit 1
          fi
          cp "$APK" artifacts/RehaFlow.apk
          ls -lh artifacts/RehaFlow.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RehaFlow-Android-APK
          path: artifacts/RehaFlow.apk
          if-no-files-found: error
          retention-days: 30
