name: Build RehaFlow Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: rehaflow-android-apk
  cancel-in-progress: true

jobs:
  build-android:
    name: Build RehaFlow APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build release APK with Gradle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "Release APK was not produced"
            exit 1
          fi
          cp "$APK" artifacts/RehaFlow.apk
          ls -lh artifacts/RehaFlow.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RehaFlow-Android-APK
          path: artifacts/RehaFlow.apk
          retention-days: 14
