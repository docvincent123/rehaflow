name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build RehaFlow APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo/EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Dynamic app.config.ts cannot be modified automatically by EAS.
      # Create/link the project in the Expo account and expose its ID to app.config.ts.
      - name: Create or link EAS project
        shell: bash
        run: |
          set -euo pipefail
          eas init --account xavyeryt --json --non-interactive > eas-init.json
          echo "EAS init result:"
          cat eas-init.json
          PROJECT_ID=$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('eas-init.json','utf8')); const id=x.projectId ?? x.project?.id ?? x.id; if(!id) { console.error('EAS project ID was not returned by eas init'); process.exit(1); } process.stdout.write(id)")
          echo "EAS_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "Linked EAS project: $PROJECT_ID"

      - name: Verify EAS configuration
        run: eas config --platform android --profile preview --non-interactive

      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Download APK
        run: |
          set -euo pipefail
          mkdir -p artifacts
          eas build --platform android --profile preview --non-interactive --output artifacts/RehaFlow.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RehaFlow-Android-APK
          path: artifacts/RehaFlow.apk
          retention-days: 14
